spring:
  datasource:
    url: jdbc:h2:mem:meeting-helper-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:DDL/meeting_helper.sql
      continue-on-error: false

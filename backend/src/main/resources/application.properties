spring.application.name=meeting-helper
server.port=8080

spring.datasource.url=${MEETING_DB_URL:jdbc:postgresql://localhost:5432/meeting_helper}
spring.datasource.username=${MEETING_DB_USERNAME:postgres}
spring.datasource.password=${MEETING_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.jackson.default-property-inclusion=non_null

spring:
  application:
    name: meeting-helper
  datasource:
    url: jdbc:postgresql://localhost:5432/meeting_helper
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

agent:
  enabled: false
  provider: mock
  max-tool-steps: 8
  max-model-retries-per-step: 1
  max-tool-retries-per-step: 1
  max-duration-seconds: 60
  allow-frontend-draft-tools: false
  allow-commit-tools: false
  internal:
    agent-chat-url: ''
    model-url: ''
    model: ''
    iam-token-env: MEETING_AGENT_INTERNAL_IAM_TOKEN
    space-id: ''
    super-agent-id: ''
    bundle-id: ''
    agent-alias: ''
  external:
    base-url: ''
    api-key-env: MEETING_AGENT_EXTERNAL_API_KEY
    model: deepseek-chat

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
